<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#397c68" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>To Buy</title>
  </head>
  <body>
    <header>
      <div>
        <small>SHOPPING REMINDERS</small>
        <h1 id="title">To Buy</h1>
      </div>
      <button id="add" class="primary" aria-label="Add item">＋ Add</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav aria-label="Navigation">
      <button data-page="active"><span>☷</span>To Buy</button>
      <button data-page="tags"><span>◇</span>Tags</button>
      <button data-page="history"><span>↶</span>History</button>
      <button data-page="settings"><span>⚙</span>Settings</button>
    </nav>
    <dialog id="editor">
      <form id="item-form">
        <h2 id="editor-title">Add item</h2>
        <label
          >Item name<input
            id="name"
            required
            maxlength="200"
            placeholder="What do you need to buy?"
        /></label>
        <label>Tags</label>
        <div id="chosen" class="chips"></div>
        <div class="line">
          <input
            id="tag-input"
            placeholder="Search or create tag"
            maxlength="80"
            autocomplete="off"
            aria-label="Search or create tag"
          /><button type="button" id="add-tag">Add</button>
        </div>
        <div id="suggestions" class="chips"></div>
        <label class="line"
          ><input type="checkbox" id="priority" /> Priority item</label
        >
        <label
          >Notes<textarea
            id="notes"
            rows="3"
            placeholder="Size, model, colour…"
          ></textarea>
        </label>
        <label
          >Product link<input id="url" type="url" placeholder="https://…"
        /></label>
        <div class="line actions">
          <button type="button" id="cancel">Cancel</button
          ><button class="primary" type="submit">Save item</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="import" accept="application/json,.json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
